# Explicit disposable local integration service only; never auto-started by runtime.
services:
  postgres:
    image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment:
      POSTGRES_USER: verisoc_admin
      POSTGRES_PASSWORD: verisoc_test_only
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:54329:5432"]
    tmpfs: [/var/lib/postgresql/data]
    volumes:
      - ./migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
      - ./migrations/002_test_role.sql:/docker-entrypoint-initdb.d/002_test_role.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U verisoc_admin -d postgres]
      interval: 2s
      timeout: 5s
      retries: 20
