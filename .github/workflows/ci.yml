name: Offline checks and tenant isolation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: engineering-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  engineering:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: verisoc_admin
          POSTGRES_PASSWORD: verisoc_test_only
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U verisoc_admin -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      VERISOC_TEST_ADMIN_URL: postgresql://verisoc_admin:verisoc_test_only@127.0.0.1:5432/postgres
      VERISOC_TEST_DATABASE_URL: postgresql+psycopg://verisoc_app:verisoc_test_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, node24
        with:
          python-version: 3.12.13
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0, node24
        with:
          version: 0.11.8
      - run: uv sync --frozen --all-extras --no-editable
      - run: make lint
      - run: make test-all
      - run: uv run --frozen --no-editable python scripts/bootstrap_postgres.py
      - run: make test-integration
      - run: make demo
      - run: make bench-smoke
      - run: make workflow-demo WORKFLOW_DIR=artifacts/runs/ci-workflow
      - run: make verify-export
